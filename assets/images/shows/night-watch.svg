<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A watchtower silhouetted against a starry night sky with light on the horizon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset=".6" stop-color="#13243e"/>
      <stop offset=".86" stop-color="#2d4466"/>
      <stop offset="1" stop-color="#6d7f99"/>
    </linearGradient>
    <radialGradient id="dawn" cx=".78" cy="1" r=".55">
      <stop offset="0" stop-color="#e8c47e" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#c9a45c" stop-opacity=".25"/>
      <stop offset="1" stop-color="#c9a45c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3d899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f3d899" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <rect y="200" width="640" height="200" fill="url(#dawn)"/>
  <g fill="#e9eef5">
    <circle cx="48" cy="40" r="1.2"/><circle cx="120" cy="88" r="1.6"/><circle cx="196" cy="30" r="1"/><circle cx="262" cy="70" r="1.4"/>
    <circle cx="330" cy="24" r="1.1"/><circle cx="398" cy="58" r="1.8"/><circle cx="470" cy="36" r="1"/><circle cx="530" cy="92" r="1.3"/>
    <circle cx="596" cy="48" r="1.6"/><circle cx="84" cy="150" r="1"/><circle cx="440" cy="128" r="1.1"/><circle cx="574" cy="160" r="1"/>
    <circle cx="300" cy="120" r=".9"/><circle cx="20" cy="110" r="1.1"/>
  </g>
  <path d="M0 300 C120 286 220 296 330 290 S540 280 640 288 V400 H0Z" fill="#0d1626"/>
  <path d="M0 330 C140 318 260 326 380 322 S560 316 640 322 V400 H0Z" fill="#080d17"/>
