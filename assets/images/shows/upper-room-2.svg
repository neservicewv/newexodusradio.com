<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Candlelight on a table beneath an arched window in an upper room" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#e6b96a" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#7a5630" stop-opacity=".25"/>
      <stop offset="1" stop-color="#17191d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22385a"/>
      <stop offset="1" stop-color="#4c6385"/>
    </linearGradient>
    <radialGradient id="flame" cx=".5" cy=".6" r=".5">
      <stop offset="0" stop-color="#fff7de"/>
      <stop offset=".6" stop-color="#f3c66e"/>
      <stop offset="1" stop-color="#d48a2f"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="#17191d"/>
  <!-- stone wall courses -->
  <g stroke="#23262c" stroke-width="2">
    <path d="M0 60H640M0 120H640M0 180H640M0 240H640"/>
    <path d="M80 0V60M240 0V60M400 0V60M560 0V60M160 60V120M480 60V120M80 120V180M560 120V180M160 180V240M480 180V240"/>
  </g>
  <!-- arched windows -->
  <g>
    <path d="M226 236 V120 a44 44 0 0 1 88 0 V236Z" fill="url(#win)"/>
    <path d="M326 236 V120 a44 44 0 0 1 88 0 V236Z" fill="url(#win)" transform="translate(0 0)"/>
    <path d="M270 76v160M370 76v160M226 160h88M326 160h88" stroke="#17191d" stroke-width="5"/>
    <circle cx="298" cy="104" r="1.6" fill="#e9eef5"/><circle cx="350" cy="96" r="1.2" fill="#e9eef5"/><circle cx="392" cy="128" r="1.4" fill="#e9eef5"/>
  </g>
  <rect width="640" height="400" fill="url(#glow)"/>
  <!-- table -->
  <path d="M60 300 H580 L600 318 H40Z" fill="#3a2b1e"/>
  <rect x="40" y="318" width="560" height="14" fill="#2a2017"/>
  <rect x="0" y="332" width="640" height="68" fill="#121316"/>
  <!-- book -->
  <g transform="translate(110 282)">
    <path d="M0 14 L70 4 L140 14 L140 22 L70 16 L0 22Z" fill="#100f0d"/>
    <path d="M4 12 L70 2 L70 15 L4 20Z" fill="#e8dcc0"/><path d="M136 12 L70 2 L70 15 L136 20Z" fill="#dacdae"/>
  </g>
  <!-- bread & cup -->
  <ellipse cx="470" cy="296" rx="42" ry="10" fill="#8a6136"/>
  <path d="M440 294 c6-14 54-14 60 0" fill="#a87643"/>
  <path d="M388 300 l6-34 h22 l6 34Z" fill="#7a6a54"/><ellipse cx="405" cy="266" rx="11" ry="3" fill="#4a3c2c"/>
  <!-- candle -->
  <rect x="304" y="234" width="32" height="68" rx="3" fill="#efe4cc"/>
  <ellipse cx="320" cy="234" rx="16" ry="4" fill="#f8efdb"/>
  <path d="M320 236 v-8" stroke="#2a2017" stroke-width="2"/>
  <path d="M320 196 c10 14 12 24 0 32 c-12-8 -10-18 0-32Z" fill="url(#flame)"/>
  <circle cx="320" cy="214" r="40" fill="#f7d58c" opacity=".14"/>
</svg>
